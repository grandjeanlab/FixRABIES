[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "fixrabies"
version = "0.1.3"
description = "ICA-FIX workflow for rodent fMRI"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "pyfix @ git+https://github.com/grandjeanlab/pyfix.git",
    "pandas",
    "nilearn",
    "nipype",
    "click",
    "pyyaml", 
    "pyside6<6.10"
]

[project.optional-dependencies]
patch = [
    "patch-denoise"
]

dev = [
    "pytest",
    "ruff",
    "black",
    "debugpy",
]

[project.scripts]
fixrabies = "fixrabies.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'"
]
