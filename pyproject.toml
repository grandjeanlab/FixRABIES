[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "fixrabies"
version = "0.1.0"
description = "ICA-FIX workflow for rodent fMRI"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "pyfix @ git+https://github.com/grandjeanlab/pyfix.git",
    "pandas",
    "nilearn",
    "nipype",
    "click",
    "pyyaml"
]

[project.optional-dependencies]
gui = [
    "PySide6",
]

patch = [
    "patch-denoise @ git+https://github.com/paquiteau/patch-denoising.git"
]

dev = [
    "pytest",
    "ruff",
    "black",
    "debugpy",
]

[project.scripts]
fixrabies = "fixrabies.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
